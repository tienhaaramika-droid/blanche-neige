<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every Tonne Counts: The CO2 Catcher</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#060916;color:#fff;font-family:"Courier New",monospace;text-align:center;min-height:100%}body{padding:10px;background:radial-gradient(circle at 50% 0,#162a54,#050711 72%)}h1{margin:4px;font:italic 900 clamp(24px,5vw,46px)/.95 Impact,sans-serif;letter-spacing:.04em;color:#6effe8;text-shadow:3px 3px #26309c,0 0 14px #19ffd5}.tag{color:#ffe65b;font-weight:bold;margin:5px}.frame{position:relative;width:min(96vw,960px);margin:auto}.title{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(#041532aa,#07112055 55%,#06101eea);border:3px solid #54ffe0}.title h2{font:italic 900 clamp(40px,9vw,88px)/.8 Impact,sans-serif;margin:0;color:#fff64f;text-shadow:5px 5px #e43457,0 0 18px #fff64f}.title h3{color:#63ffe8;font-size:clamp(18px,4vw,36px);margin:18px}.press{margin-top:18px;font-size:clamp(18px,3vw,28px);animation:blink 1s steps(2) infinite;text-shadow:0 0 10px #fff}@keyframes blink{50%{opacity:.18}}canvas{width:100%;height:auto;display:block;border:3px solid #54ffe0;box-shadow:0 0 22px #22d7c4;background:#5cbcf2;image-rendering:pixelated}.help{max-width:960px;margin:8px auto;color:#ccd9eb;font-size:13px}.buttons{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.buttons button{background:#152344;color:#fff;border:1px solid #54ffe0;border-radius:5px;padding:8px 11px;font:bold 13px "Courier New";cursor:pointer}.buttons button:focus-visible{outline:3px solid #fff}.mobile{display:none;grid-template-columns:1fr 1fr 1fr;max-width:480px;margin:8px auto;gap:7px}.mobile button{min-height:52px;font-size:18px}@media(max-width:650px){.mobile{display:grid}}
</style></head>
<body>
<h1>EVERY TONNE COUNTS</h1><div class="tag">SUPERMIKA AND THE CO2 CATCHER</div>
<div class="frame"><canvas id="game" width="960" height="640" aria-label="Every Tonne Counts retro arcade game"></canvas><section id="title" class="title"><h2>EVERY TONNE<br>COUNTS</h2><h3>THE CO2 CATCHER</h3><div>Catch carbon. Protect the city. Hold the line below 2°C.</div><div class="press">PRESS ENTER</div></section></div>
<div class="help">← → or A/D move · ↑/↓ or W/S climb ladders · SPACE capture beam · M music · ENTER start/restart</div>
<div class="buttons"><button id="musicBtn">MUSIC: ON</button><button id="pauseBtn">PAUSE</button></div>
<div class="mobile"><button data-key="arrowleft">◀</button><button data-key=" ">CAPTURE</button><button data-key="arrowright">▶</button></div>
<script>
const C=document.getElementById('game'),g=C.getContext('2d'),title=document.getElementById('title');g.imageSmoothingEnabled=false;
let keys={},started=false,paused=false,over=false,frame=0,temp=.35,captured=0,escaped=0,streak=0,best=0,nextMilestone=10_000_000,lastCelebrated=0,warning15=false,flash=0,boost=0,puffs=[],particles=[],rockets=[],factories=[];
const P={x:455,y:515,w:34,h:50,vy:0,beam:0,climbing:false};
const platforms=[{x:0,y:565,w:820},{x:70,y:400,w:85},{x:220,y:400,w:85},{x:390,y:400,w:85},{x:575,y:400,w:85},{x:750,y:400,w:70},{x:72,y:285,w:60},{x:222,y:255,w:60},{x:392,y:275,w:60},{x:577,y:245,w:60},{x:752,y:265,w:60}];
const ladders=[{x:115,y1:400,y2:565},{x:265,y1:400,y2:565},{x:435,y1:400,y2:565},{x:620,y1:400,y2:565},{x:785,y1:400,y2:565},{x:105,y1:285,y2:400},{x:255,y1:255,y2:400},{x:425,y1:275,y2:400},{x:610,y1:245,y2:400},{x:780,y1:265,y2:400}];
const VALUES=[10,1000,10000,100000,500000,1000000],COLORS=['#d8fdff','#5effee','#71ff76','#ffcf52','#d87bff','#fff263'];
function reset(){frame=0;temp=.35;captured=escaped=streak=best=0;nextMilestone=10_000_000;lastCelebrated=0;warning15=false;flash=boost=0;puffs=[];particles=[];rockets=[];over=false;paused=false;P.x=455;P.y=515;P.vy=0;P.climbing=false;factories=[{x:80,h:115,rate:145},{x:230,h:145,rate:120},{x:400,h:125,rate:100},{x:585,h:155,rate:112},{x:760,h:135,rate:92}];}
function start(){reset();started=true;title.style.display='none';startAudio()}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Enter'&&(!started||over))start();if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='m')toggleMusic()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.mobile button').forEach(b=>{let k=b.dataset.key;['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=true}));['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))});
document.getElementById('musicBtn').onclick=toggleMusic;document.getElementById('pauseBtn').onclick=()=>paused=!paused;
function spawn(f){let idx=Math.floor(Math.random()*VALUES.length),v=VALUES[idx],hard=v>=500000; puffs.push({x:f.x+38,y:400-f.h,r:hard?16:12,vx:(Math.random()-.5)*.7,vy:-.38-Math.random()*.32,value:v,color:COLORS[idx],phase:Math.random()*6.28});}
function update(){if(!started||paused||over)return;frame++;let urgency=1+temp*.55;factories.forEach(f=>{if(frame%Math.max(38,Math.floor(f.rate/urgency))===0)spawn(f)});P.x+=(keys.arrowleft||keys.a?-4:0)+(keys.arrowright||keys.d?4:0);P.x=Math.max(20,Math.min(786,P.x));
 const cx=P.x+P.w/2,feet=P.y+P.h;const near=ladders.find(l=>Math.abs(cx-l.x)<22&&feet>=l.y2-15&&P.y<=l.y1+16)||ladders.find(l=>Math.abs(cx-l.x)<22&&feet>=l.y1-12&&P.y<=l.y2+12);
 if(near&&(keys.arrowup||keys.w||keys.arrowdown||keys.s)){P.climbing=true;P.vy=0;P.x=near.x-P.w/2;P.y+=(keys.arrowup||keys.w)?-3.4:3.4;P.y=Math.max(near.y1-P.h,Math.min(near.y2-P.h,P.y));}
 else if(P.climbing&&near){P.vy=0;}else{P.climbing=false;P.vy+=.48;P.y+=P.vy;let landing=null;for(const q of platforms){if(P.x+P.w>q.x&&P.x<q.x+q.w&&P.y+P.h>=q.y&&P.y+P.h<=q.y+12&&P.vy>=0){landing=q;break}}if(landing){P.y=landing.y-P.h;P.vy=0}if(P.y>515){P.y=515;P.vy=0}}
 P.beam=(keys[' ']||keys.x)?1:0;
 puffs.forEach(p=>{p.phase+=.06;p.x+=p.vx+Math.sin(p.phase)*.25;p.y+=p.vy;if(P.beam&&p.y>P.y-175&&p.y<P.y+45&&Math.abs((P.x+17)-p.x)<62+boost*18){p.caught=true;captured+=p.value;streak++;best=Math.max(best,streak);burst(p.x,p.y,p.color);beep(520+Math.min(500,p.value/2000),.08,'square',.035)}if(p.y<25&&!p.caught){p.missed=true;escaped+=p.value;streak=0;temp+=.012+Math.log10(Math.max(10,p.value))*0.0015;burst(p.x,35,'#ff7a47')}});puffs=puffs.filter(p=>!p.caught&&!p.missed);
 particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.life--});particles=particles.filter(q=>q.life>0);rockets.forEach(r=>{r.y-=4;r.life--;if(r.life===25)firework(r.x,r.y)});rockets=rockets.filter(r=>r.life>0);if(boost>0)boost--;
 while(captured>=nextMilestone){lastCelebrated=nextMilestone;nextMilestone+=10_000_000;celebrate();temp=Math.max(.25,temp-.07);boost=600}
 if(temp>=1.5&&!warning15){warning15=true;flash=150;alarm()}if(flash>0)flash--;if(temp>=2){temp=2;over=true;stopMusic();doom()}}
function burst(x,y,c){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:25+Math.random()*20,c})}
function celebrate(){fanfare();for(let i=0;i<7;i++)rockets.push({x:140+i*110,y:610+Math.random()*50,life:45+Math.floor(Math.random()*18),c:COLORS[i%COLORS.length]})}
function firework(x,y){for(let i=0;i<24;i++){let a=i/24*Math.PI*2;particles.push({x,y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,life:50,c:COLORS[i%COLORS.length]})}}
function skyColor(){if(temp<.5)return ['#37a9ed','#9de9ff'];if(temp<1)return ['#8bc7dc','#f4e894'];if(temp<1.5)return ['#e8b75e','#ffcf70'];if(temp<2)return ['#e57939','#ffb05c'];return ['#e86b67','#ffb0a6']}
function mix(a,b,t){const A=a.match(/\w\w/g).map(x=>parseInt(x,16)),B=b.match(/\w\w/g).map(x=>parseInt(x,16));return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function draw(){let sc=skyColor(),gr=g.createLinearGradient(0,0,0,430);gr.addColorStop(0,sc[0]);gr.addColorStop(1,sc[1]);g.fillStyle=gr;g.fillRect(0,0,960,640);drawSun();drawCity();drawFactories();drawPark();puffs.forEach(drawPuff);drawPlayer();particles.forEach(q=>{g.fillStyle=q.c;g.fillRect(q.x,q.y,4,4)});rockets.forEach(r=>{g.fillStyle=r.c;g.fillRect(r.x,r.y,4,14)});drawPanel();if(flash>0&&Math.floor(flash/12)%2===0){g.fillStyle='#ff762b55';g.fillRect(0,0,960,640)}if(paused)message('PAUSED','PRESS PAUSE TO CONTINUE');if(over)message('2.0°C REACHED','CAPTURE SYSTEM OVERWHELMED · PRESS ENTER')}
function drawSun(){let r=42+(temp*.8),col=temp<1.5?'#ffe75b':temp<2?'#ff8d2f':'#8d1717';g.fillStyle=col;g.beginPath();g.arc(820,90,r,0,7);g.fill()}
function drawCity(){let dry=Math.min(1,temp/2);g.fillStyle=mix('#305f83','#733d45',dry);for(let i=0;i<16;i++){let x=i*58,h=65+(i*37%90);g.fillRect(x,330-h,48,h);g.fillStyle=temp<1.5?'#fff194':'#d1654b';for(let yy=340-h;yy<320;yy+=17)for(let xx=x+8;xx<x+42;xx+=14)g.fillRect(xx,yy,5,7);g.fillStyle=mix('#305f83','#733d45',dry)}}
function drawFactories(){factories.forEach((f,i)=>{g.fillStyle='#4d5267';g.fillRect(f.x,400-f.h,74,f.h);g.fillStyle='#69748c';g.fillRect(f.x+12,400-f.h-42,18,42);g.fillStyle='#ef5461';g.fillRect(f.x+12,400-f.h-42,18,8);g.fillStyle='#a3b3c7';g.fillRect(f.x+42,355-f.h,22,45);g.fillStyle='#f3cb4c';g.fillRect(f.x+5,390,64,8);g.fillStyle='#161b28';g.font='10px monospace';g.fillText(['CEMENT','WASTE','STEEL','PULP','CHEM'][i],f.x+7,384)});drawAccess()}
function drawAccess(){g.strokeStyle='#ffd54f';g.lineWidth=4;ladders.forEach(l=>{g.beginPath();g.moveTo(l.x-10,l.y1);g.lineTo(l.x-10,l.y2);g.moveTo(l.x+10,l.y1);g.lineTo(l.x+10,l.y2);for(let y=l.y1;y<=l.y2;y+=14){g.moveTo(l.x-10,y);g.lineTo(l.x+10,y)}g.stroke()});g.strokeStyle='#ff6e59';g.lineWidth=6;platforms.slice(1).forEach(q=>{g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x+q.w,q.y);g.stroke();g.strokeStyle='#ffd54f';g.lineWidth=2;g.beginPath();g.moveTo(q.x,q.y-16);g.lineTo(q.x+q.w,q.y-16);g.moveTo(q.x,q.y-16);g.lineTo(q.x,q.y);g.moveTo(q.x+q.w,q.y-16);g.lineTo(q.x+q.w,q.y);g.stroke();g.strokeStyle='#ff6e59';g.lineWidth=6})}
function drawPark(){let d=Math.min(1,Math.max(0,(temp-.35)/1.65));g.fillStyle=mix('#3da94d','#a96e39',d);g.fillRect(0,400,820,240);g.fillStyle=mix('#5cb8e8','#8e7159',d);g.fillRect(690,565,110,45);for(let i=0;i<9;i++)tree(35+i*85,470+(i%2)*35,d);g.fillStyle='#c49a65';g.fillRect(0,590,820,50)}
function tree(x,y,d){g.fillStyle='#6c4427';g.fillRect(x-5,y,10,42);g.fillStyle=mix('#1f9d42','#806633',d);let size=27*(1-d*.5);g.beginPath();g.arc(x,y-10,size,0,7);g.fill();if(d>.72){g.strokeStyle='#6c4427';g.beginPath();g.moveTo(x,y);g.lineTo(x-18,y-28);g.moveTo(x,y);g.lineTo(x+18,y-30);g.stroke()}}
function drawPuff(p){g.fillStyle=p.color;g.globalAlpha=.82;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.arc(p.x+12,p.y+3,p.r*.7,0,7);g.arc(p.x-12,p.y+5,p.r*.65,0,7);g.fill();g.globalAlpha=1;g.fillStyle='#083044';g.font='bold 10px monospace';g.fillText('CO₂',p.x-10,p.y+4)}
function drawPlayer(){let x=P.x,y=P.y;g.fillStyle='#126cff';g.fillRect(x,y+12,34,34);g.fillStyle='#f126a8';g.fillRect(x+3,y,27,11);g.fillStyle='#eabb83';g.fillRect(x+8,y+9,18,13);g.fillStyle='#10131d';g.fillRect(x+2,y+43,12,7);g.fillRect(x+21,y+43,12,7);g.fillStyle='#2fffe0';g.fillRect(x-10,y+16,11,20);g.strokeStyle='#2fffe0';g.lineWidth=4;g.beginPath();g.moveTo(x-4,y+18);g.lineTo(x+17,y-15);g.stroke();if(P.beam){let w=55+boost*18;g.fillStyle='#5effe844';g.beginPath();g.moveTo(x+17,y-15);g.lineTo(x+17-w,y-175);g.lineTo(x+17+w,y-175);g.closePath();g.fill();g.strokeStyle='#8dfff0';g.stroke()}}
function drawPanel(){g.fillStyle='#07101ce8';g.fillRect(820,0,140,640);g.strokeStyle='#54ffe0';g.lineWidth=3;g.strokeRect(827,10,126,620);g.font='bold 15px monospace';g.fillStyle='#54ffe0';g.fillText('CONTROL',852,38);g.fillStyle='#fff';g.font='12px monospace';g.fillText('CAPTURED',836,78);g.fillStyle='#75ff82';g.font='bold 16px monospace';g.fillText(fmt(captured),836,102);g.fillStyle='#fff';g.font='12px monospace';g.fillText('ESCAPED',836,140);g.fillStyle='#ff7b62';g.font='bold 16px monospace';g.fillText(fmt(escaped),836,164);g.fillStyle='#fff';g.font='12px monospace';g.fillText('TEMP vs 1990',836,210);g.fillStyle=temp<1.5?'#ffe65b':'#ff5b38';g.font='bold 25px monospace';g.fillText('+'+temp.toFixed(2)+'°C',835,242);g.fillStyle='#22344d';g.fillRect(838,260,102,16);g.fillStyle=temp<1.5?'#ffe65b':'#ff5b38';g.fillRect(838,260,102*Math.min(1,temp/2),16);g.fillStyle='#fff';g.font='12px monospace';g.fillText('STREAK '+streak,836,315);g.fillText('BEST   '+best,836,338);g.fillText('NEXT',836,385);g.fillStyle='#54ffe0';g.font='bold 14px monospace';g.fillText(fmt(nextMilestone-captured),836,409);g.fillStyle='#fff';g.font='11px monospace';g.fillText('TO MILESTONE',836,429);if(boost){g.fillStyle='#ffe65b';g.font='bold 12px monospace';g.fillText('CAPTURE BOOST!',836,472)}g.fillStyle=temp>=1.5?'#ff694c':'#67ffac';g.font='bold 12px monospace';g.fillText(temp>=1.5?'CRITICAL':'SYSTEM ONLINE',836,610)}
function fmt(v){if(v>=1e6)return (v/1e6).toFixed(2)+' Mtpa';if(v>=1e3)return (v/1e3).toFixed(1)+' ktpa';return Math.round(v)+' tpa'}
function message(a,b){g.fillStyle='#050611dd';g.fillRect(95,230,700,180);g.strokeStyle='#ff713f';g.lineWidth=5;g.strokeRect(95,230,700,180);g.textAlign='center';g.fillStyle='#ffdf4d';g.font='bold 43px Impact';g.fillText(a,445,300);g.fillStyle='#fff';g.font='18px monospace';g.fillText(b,445,350);if(over){g.fillText('CAPTURED '+fmt(captured)+' · ESCAPED '+fmt(escaped),445,382)}g.textAlign='left'}
let audio,musicTimer,musicOn=true,mstep=0;const lead=[261.63,329.63,392,523.25,493.88,392,329.63,293.66,261.63,392,440,659.25,523.25,440,392,329.63],bass=[65.41,65.41,82.41,98,73.42,73.42,98,110];function beep(f,d,type='square',v=.03){if(!audio||!musicOn)return;let o=audio.createOscillator(),q=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q).connect(audio.destination);o.start(n);o.stop(n+d)}function musicTick(){if(!musicOn||over)return;let urgency=temp>=1.5?1.22:temp>=1?1.1:1;beep(lead[mstep%lead.length]*urgency,.14,'square',.022);if(mstep%2===0)beep(bass[mstep%bass.length],.24,'triangle',.04);if(mstep%4===0)beep(100,.05,'square',.018);mstep++}function startAudio(){if(!audio)audio=new(AudioContext||webkitAudioContext)();audio.resume();if(!musicTimer)musicTimer=setInterval(musicTick,155)}function stopMusic(){clearInterval(musicTimer);musicTimer=null}function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').textContent='MUSIC: '+(musicOn?'ON':'OFF');if(musicOn)startAudio();else stopMusic()}function fanfare(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,.24,'square',.08),i*120))}function alarm(){[220,165,220,130].forEach((n,i)=>setTimeout(()=>beep(n,.22,'sawtooth',.07),i*180))}function doom(){if(!audio)return;musicOn=true;[110,82,55].forEach((n,i)=>setTimeout(()=>beep(n,.7,'sawtooth',.1),i*170))}
function loop(){update();draw();requestAnimationFrame(loop)}reset();draw();loop();
</script></body></html>
