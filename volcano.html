<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOLCANO HEAT</title><style>*{box-sizing:border-box}html,body{margin:0;background:#060712;color:#fff;font-family:monospace;text-align:center}body{padding:10px}h1{font:italic 900 clamp(30px,7vw,60px) Impact,sans-serif;color:#ff5a30;text-shadow:4px 4px #6e174e,0 0 16px #ff8a33;margin:4px}.sub{color:#6ffaff;margin:4px}.wrap{position:relative;width:min(96vw,960px);margin:auto}.title{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;background:radial-gradient(circle at 74% 72%,#ff5a2c88 0 7%,transparent 8%),linear-gradient(#08071bdd 0 42%,#3d0d1fdd 76%,#090812 100%);border:3px solid #ff6537}.title:before{content:'';position:absolute;left:-8%;right:-8%;bottom:10%;height:18%;background:repeating-linear-gradient(0deg,#1a1942 0 5px,#ff3f7133 6px 8px);transform:perspective(240px) rotateX(56deg);transform-origin:bottom;box-shadow:0 -14px 28px #ff4a3655}.title:after{content:'▲';position:absolute;right:11%;bottom:12%;font-size:clamp(120px,25vw,240px);line-height:.55;color:#391a2a;text-shadow:0 -12px 0 #ff5a32,0 -23px 12px #ffbb3655;transform:scaleX(1.4)}.title .logo{position:relative;z-index:2;font:italic 900 clamp(58px,12vw,126px)/.78 Impact,sans-serif;color:#ffda4f;text-shadow:7px 7px #c72439,0 0 21px #ff613b}.titleJet{position:absolute;z-index:1;left:6%;bottom:17%;width:42%;height:14%;background:#070910;clip-path:polygon(0 56%,58% 39%,70% 5%,77% 7%,72% 38%,100% 52%,72% 57%,77% 92%,69% 94%,57% 61%);filter:drop-shadow(0 0 8px #58eaff)}.titleJet:after{content:'';position:absolute;left:-8%;top:48%;width:25%;height:8%;background:#ff6a35;box-shadow:-16px 0 10px #ffca3a}.mission{position:relative;z-index:2;margin-top:14px;color:#6ffaff;font-size:clamp(11px,2vw,16px);letter-spacing:.12em}.press{position:relative;z-index:2;margin-top:35px.press{margin-top:35px;font-size:clamp(18px,3vw,28px);animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.15}}canvas{display:block;width:100%;height:auto;border:3px solid #ff613b;box-shadow:0 0 24px #ff613b;background:#5fb4e9;image-rendering:pixelated}.help{font-size:13px;color:#cbd4e8;margin:7px}.btn{background:#161b39;color:#fff;border:1px solid #6ffaff;padding:8px 12px;border-radius:5px}.mobile{display:none;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin:8px auto}.mobile button{min-height:48px}@media(max-width:650px){.mobile{display:grid}}</style></head><body><h1>VOLCANO HEAT</h1><div class="sub">MACH 4 · DOGFIGHTS · RADIOACTIVE KRAKEN</div><div class="wrap"><canvas id="game" width="960" height="600"></canvas><div id="title" class="title"><div class="logo">VOLCANO<br>HEAT</div><div class="mission">BLACK MACH-4 INTERCEPTOR · VOLCANO ISLAND AHEAD</div><div class="titleJet"></div><div class="press">PRESS ENTER TO START</div></div></div><div class="help">← → ↑ ↓ / WASD fly · SPACE cannon · B bomb at volcano · M music · ENTER start/restart</div><button id="musicBtn" class="btn">MUSIC: ON</button><div class="mobile"><button data-key="arrowleft">◀</button><button data-key=" ">FIRE</button><button data-key="arrowright">▶</button><button data-key="arrowup">▲</button><button data-key="b">BOMB</button><button data-key="arrowdown">▼</button></div><script>
const C=document.getElementById('game'),g=C.getContext('2d'),title=document.getElementById('title');g.imageSmoothingEnabled=false;let keys={},started=false,over=false,won=false,frame=0,life=100,score=0,scroll=0,stage=0,enemies=[],shots=[],enemyShots=[],fx=[],boss=false,bombReady=false,krakenY=630,krakenRise=0,volcanoHit=false;const P={x:150,y:280,w:62,h:24,cool:0};
function reset(){frame=0;life=100;score=scroll=stage=0;enemies=[];shots=[];enemyShots=[];fx=[];boss=false;bombReady=false;krakenY=630;krakenRise=0;volcanoHit=false;over=won=false;P.x=150;P.y=280;P.cool=0}
function start(){reset();started=true;title.style.display='none';startMusic()}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Enter'&&(!started||over||won))start();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='m')toggleMusic()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('.mobile button').forEach(b=>{let k=b.dataset.key;['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=1}));['pointerup','touchend','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=0}))});document.getElementById('musicBtn').onclick=toggleMusic;
function spawnEnemy(){let y=70+Math.random()*390;enemies.push({x:990,y,w:45,h:18,vx:-3.3-Math.random()*2,phase:Math.random()*6.28,hp:1,cool:45+Math.random()*75})}
function hit(dmg,x,y){life=Math.max(0,life-dmg);boom(x,y,'#ff6938',10);blast(.08);if(life<=0){over=true;stopMusic();bigBlast(P.x,P.y)}}function boom(x,y,c,n=12){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:25+Math.random()*25,c})}function bigBlast(x,y){boom(x,y,'#ffe45b',55);boom(x,y,'#ff3d25',55);blast(.28)}
function update(){if(!started||over||won)return;frame++;P.x+=((keys.arrowright||keys.d)?5:0)-((keys.arrowleft||keys.a)?5:0);P.y+=((keys.arrowdown||keys.s)?5:0)-((keys.arrowup||keys.w)?5:0);P.x=Math.max(20,Math.min(520,P.x));P.y=Math.max(40,Math.min(500,P.y));if(P.cool>0)P.cool--;if((keys[' ']||keys.x)&&P.cool===0){shots.push({x:P.x+58,y:P.y+10,vx:10,vy:0});P.cool=8;pew()}
if(!boss){scroll+=4.1;stage=Math.min(5,Math.floor(scroll/2600));if(frame%Math.max(42,85-stage*7)===0)spawnEnemy();if(scroll>12800){boss=true;enemies=[];enemyShots=[];krakenY=520;bossMusic()}}
enemies.forEach(e=>{e.phase+=.06;e.x+=e.vx;e.y+=Math.sin(e.phase)*1.2;e.cool--;if(e.cool<0&&e.x>380){enemyShots.push({x:e.x,y:e.y+7,vx:-6,vy:(P.y-e.y)/120});e.cool=85+Math.random()*80}if(box(P,e)){e.dead=1;hit(1+Math.floor(Math.random()*2),e.x,e.y)}});enemies=enemies.filter(e=>e.x>-70&&!e.dead);
shots.forEach(s=>{s.x+=s.vx;enemies.forEach(e=>{if(!e.dead&&point(s,e)){e.dead=1;s.dead=1;score+=100;boom(e.x,e.y,'#ffb83d')}})});enemyShots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(s.x>P.x&&s.x<P.x+P.w&&s.y>P.y&&s.y<P.y+P.h){s.dead=1;hit(1+Math.floor(Math.random()*2),P.x,P.y)}});
if(boss)updateBoss();shots=shots.filter(s=>s.x<1000&&!s.dead);enemyShots=enemyShots.filter(s=>s.x>-10&&!s.dead);fx.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.08;q.life--});fx=fx.filter(q=>q.life>0)}
function point(s,e){return s.x>e.x&&s.x<e.x+e.w&&s.y>e.y&&s.y<e.y+e.h}function box(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
const tentacles=[];function initTentacles(){tentacles.length=0;for(let i=0;i<7;i++)tentacles.push({a:-2.8+i*.55,hp:3+Math.floor(Math.random()*3),dead:false})}
function updateBoss(){if(tentacles.length===0)initTentacles();if(krakenRise===0){krakenY=Math.max(315,krakenY-1.4);shots.forEach(s=>tentacles.forEach((t,i)=>{if(t.dead)return;let tx=820+Math.cos(t.a)*70,ty=krakenY+Math.sin(t.a)*75; if(Math.hypot(s.x-tx,s.y-ty)<32){s.dead=1;t.hp--;boom(tx,ty,'#50ff85',6);if(t.hp<=0){t.dead=true;bigBlast(tx,ty);score+=500}}}));if(tentacles.every(t=>t.dead)){krakenRise=1;fanfare();bombReady=true}}else{krakenY-=1.8}
if(bombReady&&(keys.b||keys.z)&&P.x>420){bombReady=false;volcanoHit=true;setTimeout(()=>{won=true;stopMusic();volcanoBlast()},700)}}
function draw(){let sky=stage<4?'#62b7e9':'#d98a68';g.fillStyle=sky;g.fillRect(0,0,960,600);drawLandscape();if(boss)drawBoss();enemies.forEach(drawEnemy);shots.forEach(s=>{g.fillStyle='#fff36c';g.fillRect(s.x,s.y,12,3)});enemyShots.forEach(s=>{g.fillStyle='#ff3636';g.fillRect(s.x,s.y,8,4)});drawPlane();fx.forEach(q=>{g.fillStyle=q.c;g.fillRect(q.x,q.y,5,5)});hud();if(over)message('AIRFRAME LOST','LIFE 0 · PRESS ENTER');if(won)message('VOLCANO ERUPTED!','MISSION COMPLETE · YOU WON · PRESS ENTER')}
function drawLandscape(){let off=boss?0:-(scroll%960);if(stage===0){city(off);city(off+960)}else if(stage===1){factory(off);factory(off+960)}else if(stage===2){mountains(off);mountains(off+960)}else if(stage===3){farms(off);farms(off+960)}else sea();if(boss||stage===5)volcano()}
function city(o){g.fillStyle='#555d74';for(let i=0;i<18;i++){let x=o+i*58,h=55+(i*43%120);g.fillRect(x,540-h,48,h);g.fillStyle='#ffd85c';for(let y=552-h;y<525;y+=18)g.fillRect(x+8,y,6,7);g.fillStyle='#555d74'}g.fillStyle='#27394d';g.fillRect(0,540,960,60)}function factory(o){g.fillStyle='#6c6674';for(let i=0;i<8;i++){let x=o+i*130;g.fillRect(x,450,110,90);g.fillRect(x+18,360,24,90);g.fillStyle='#ddd';g.fillRect(x+18,360,24,8);g.fillStyle='#6c6674'}g.fillStyle='#48404d';g.fillRect(0,540,960,60)}function mountains(o){g.fillStyle='#55657d';for(let i=0;i<6;i++){let x=o+i*190;g.beginPath();g.moveTo(x,540);g.lineTo(x+95,300+(i%3)*55);g.lineTo(x+190,540);g.fill()}g.fillStyle='#718d62';g.fillRect(0,540,960,60)}function farms(o){g.fillStyle='#6da64b';g.fillRect(0,430,960,170);for(let i=0;i<14;i++){g.fillStyle=i%2?'#c0a64e':'#438840';g.fillRect((o+i*80)%1040,450,60,120)}}function sea(){g.fillStyle='#1768a7';g.fillRect(0,430,960,170);g.strokeStyle='#69d8ff';for(let y=450;y<590;y+=28){g.beginPath();g.moveTo(0,y);g.lineTo(960,y);g.stroke()}}function volcano(){g.fillStyle='#164272';g.fillRect(0,430,960,170);g.fillStyle=volcanoHit?'#f12f20':'#4b2336';g.beginPath();g.moveTo(660,520);g.lineTo(805,275);g.lineTo(940,520);g.fill();g.fillStyle='#1d1424';g.beginPath();g.ellipse(805,285,36,12,0,0,7);g.fill();if(volcanoHit){g.fillStyle='#ffb227';for(let i=0;i<25;i++)g.fillRect(770+Math.random()*70,160+Math.random()*130,8,25)}}
function drawPlane(){let x=P.x,y=P.y;g.fillStyle='#090b12';g.beginPath();g.moveTo(x+62,y+11);g.lineTo(x+35,y+4);g.lineTo(x+18,y);g.lineTo(x+25,y+8);g.lineTo(x,y+12);g.lineTo(x+25,y+16);g.lineTo(x+18,y+24);g.lineTo(x+38,y+19);g.closePath();g.fill();g.fillStyle='#5df5ff';g.fillRect(x+37,y+7,12,5);g.fillStyle='#ff6636';g.fillRect(x-8,y+9,12,6)}function drawEnemy(e){g.fillStyle='#d8dce9';g.beginPath();g.moveTo(e.x,e.y+8);g.lineTo(e.x+32,e.y);g.lineTo(e.x+45,e.y+8);g.lineTo(e.x+31,e.y+16);g.closePath();g.fill();g.fillStyle='#ec304b';g.fillRect(e.x+12,e.y+6,15,5)}
function drawBoss(){let cx=830,cy=krakenY;g.fillStyle='#59ff75';tentacles.forEach(t=>{if(t.dead)return;g.strokeStyle='#46d969';g.lineWidth=15;g.beginPath();g.moveTo(cx,cy);for(let k=1;k<5;k++){let r=k*24,a=t.a+Math.sin(frame*.07+k)*.14;g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}g.stroke()});g.fillStyle='#5ae877';g.beginPath();g.ellipse(cx,cy,68,50,0,0,7);g.fill();g.fillStyle='#e52763';g.fillRect(cx-38,cy-10,18,9);g.fillRect(cx+20,cy-10,18,9);if(bombReady){g.fillStyle='#fff36c';g.font='bold 15px monospace';g.fillText('KRAKEN NEUTRALIZED · FLY RIGHT + PRESS B',520,80)}}
function hud(){g.fillStyle='#07101ddd';g.fillRect(0,0,960,38);g.font='bold 16px monospace';g.fillStyle='#fff';g.fillText('LIFE',15,25);g.fillStyle=life>40?'#58ff7d':'#ff4a38';g.fillRect(68,11,life*2.2,17);g.strokeStyle='#fff';g.strokeRect(68,11,220,17);g.fillStyle='#fff';g.fillText(life+'/100',300,25);g.fillText('SCORE '+score,420,25);g.fillStyle='#6ffaff';g.fillText(boss?'VOLCANO ISLAND':'MACH 4',790,25)}function message(a,b){g.fillStyle='#050612df';g.fillRect(145,215,670,160);g.strokeStyle='#ff5d35';g.lineWidth=5;g.strokeRect(145,215,670,160);g.textAlign='center';g.fillStyle='#ffdd4f';g.font='bold 47px Impact';g.fillText(a,480,280);g.fillStyle='#fff';g.font='18px monospace';g.fillText(b,480,330);g.textAlign='left'}
let audio,musicTimer,musicOn=true,mstep=0;const melody=[329.63,392,493.88,659.25,587.33,493.88,392,440,493.88,659.25,783.99,659.25,587.33,493.88,440,392],bass=[82.41,82.41,110,82.41,98,98,123.47,98];function tone(f,d,type='square',v=.03){if(!audio||!musicOn)return;let o=audio.createOscillator(),q=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q).connect(audio.destination);o.start();o.stop(n+d)}function musicTick(){if(over||won)return;tone(melody[mstep%melody.length],.11,'square',.027);if(mstep%2===0)tone(bass[mstep%bass.length],.2,'triangle',.04);if(mstep%4===0)tone(95,.045,'square',.02);mstep++}function startMusic(){if(!audio)audio=new(AudioContext||webkitAudioContext)();audio.resume();if(!musicTimer)musicTimer=setInterval(musicTick,boss?105:125)}function stopMusic(){clearInterval(musicTimer);musicTimer=null}function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').textContent='MUSIC: '+(musicOn?'ON':'OFF');if(musicOn)startMusic();else stopMusic()}function bossMusic(){stopMusic();if(musicOn)musicTimer=setInterval(musicTick,95)}function pew(){tone(900,.05,'square',.025)}function blast(v=.1){if(!audio)return;let o=audio.createOscillator(),q=audio.createGain(),n=audio.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(130,n);o.frequency.exponentialRampToValueAtTime(35,n+.22);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+.23);o.connect(q).connect(audio.destination);o.start();o.stop(n+.24)}function fanfare(){[392,523,659,784].forEach((n,i)=>setTimeout(()=>tone(n,.25,'square',.08),i*110))}function volcanoBlast(){blast(.3);for(let i=0;i<100;i++)fx.push({x:805,y:280,vx:(Math.random()-.5)*12,vy:-Math.random()*9,life:80,c:i%2?'#ff572d':'#ffd13b'})}
function loop(){update();draw();requestAnimationFrame(loop)}reset();draw();loop();
</script></body></html>
